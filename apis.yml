name: EcoMom
description: EcoMom was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network as a stub lead for enrichment. Enrichment probing on 2026-07-20 found no
  operating company surface behind the ecomom.com domain. The domain's nameservers are
  ns1/ns2.afternic.com and every request to ecomom.com issues a 307 redirect to an Afternic
  listing headlined "The domain name ecomom.com is for sale!" with no published price. The host
  serves a wildcard soft-200 parking page - arbitrary paths, including a deliberately nonsense
  control path, all return HTTP 200 with text/html that redirects to /lander - so the 200 status
  codes returned for /.well-known/security.txt, /.well-known/openid-configuration,
  /.well-known/oauth-authorization-server, /.well-known/api-catalog, /.well-known/ai-plugin.json,
  /llms.txt and /openapi.json are parking artifacts and not real documents. The api, developer,
  docs and www subdomains resolve to the same two parking IPs. There is no developer portal, no
  documentation, no specification and no API surface to catalog, so no enrichment artifacts were
  written for this company.
